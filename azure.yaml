# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-maf-demo
metadata:
    template: azd-init
infra:
    provider: bicep
    path: infra
services:
    froyo-fulfillment-agent:
        project: source/froyo-fulfillment-agent
        host: azure.ai.agent
        language: csharp
        # uses:
        #     - foundry-project-name
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FOUNDRY_TOOLBOX_NAME: ${FOUNDRY_TOOLBOX_NAME}
            FOUNDRY_TOOLBOX_VERSION: ${FOUNDRY_TOOLBOX_VERSION}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: froyo-fulfillment-agent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: froyo-fulfillment-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    foundry-project:
        host: azure.ai.project
        endpoint: https://aif-ibce4dw3ojxak.services.ai.azure.com/api/projects/foundry-project-ibce4dw3ojxak